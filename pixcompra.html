<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento via PIX - Inovateca</title>
    <link rel="stylesheet" href="checkout.css">
</head>
<body>
    <div class="checkout-container text-center">
        <h2>Pagamento via PIX</h2>
        <p class="subtitle">Escaneie o QR Code abaixo com o aplicativo do seu banco para pagar <strong>R$ 24,99</strong>.</p>

        <div class="qr-code-box">
            <!-- Imagem genérica de QR Code de exemplo -->
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=inovateca-pix-exemplo" alt="QR Code PIX">
        </div>

        <div class="pix-copia-cola">
            <label>Código Copia e Cola:</label>
            <input type="text" value="00020126360014BR.GOV.BCB.PIX0114+5511999999999520400005303986540524.995802BR5913INOVATECA6008SAO PAULO62070503***6304E2CA" id="input-pix" readonly>
            <button type="button" class="btn-copiar" onclick="navigator.clipboard.writeText(document.getElementById('input-pix').value)">Copiar Código PIX</button>
        </div>

        <div class="pix-timer">
            <p>Este código expira em <strong>15:00</strong> minutos.</p>
        </div>

        <div class="button-group">
            <a href="Catálogo.html" class="btn-cancelar">Voltar / Cancelar</a>
            <button type="button" class="btn-confirmar" id="btnConfirmarPix">Já fiz o pagamento</button>
        </div>
    </div>

    <!-- Modal de Agradecimento e Confirmação de Pagamento -->
    <div id="modalAgradecimento" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: #fff; padding: 30px; border-radius: 8px; text-align: center; max-width: 350px; font-family: Arial, sans-serif;">
            <h2 style="color: #28a745; margin-bottom: 10px;">Pagamento Finalizado!</h2>
            <p style="color: #333; margin-bottom: 5px;">Obrigado pela sua compra.</p>
            <p style="color: #666; font-size: 14px;">Redirecionando para seus livros...</p>
        </div>
    </div>

    <script>
        document.getElementById('btnConfirmarPix').addEventListener('click', function() {
            // Exibe o aviso de pagamento finalizado e agradecimento
            document.getElementById('modalAgradecimento').style.display = 'flex';
            
            // Redireciona para "Meus Livros.html" após 3 segundos
            setTimeout(() => {
                window.location.href = "Meus Livros.html";
            }, 3000);
        });
    </script>
</body>
</html>
