<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Inovateca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="login" class="panel">
        <div class="auth-card">
            <img src="icones/logo.png" alt="Inovateca" class="logo-gigante"> 
            
            <div class="input-container">
                <div class="input-group"> 
                    <input type="email" id="email-input" placeholder="digite seu e-mail">
                </div>
                <div class="input-group">
                    <input type="password" id="senha-input" placeholder="sua senha">
                </div>
            </div>

            <button class="btn-primary" id="btnEntrar">Entrar</button>

            <div class="switch-auth">
                <p>Não possui conta?</p>
                <button class="btn-secondary" onclick="window.location.href='Cadastro.html'">Criar conta</button>
            </div>
        </div>
    </section>  
    
    <script src="script.js"></script>
    <script>
        document.getElementById('btnEntrar').addEventListener('click', function() {
            const emailDigitado = document.getElementById('email-input').value.trim();
            const senhaDigitada = document.getElementById('senha-input').value.trim();

            if (!emailDigitado || !senhaDigitada) {
                alert('Por favor, preencha o e-mail e a senha.');
                return;
            }

            // Busca a conta no localStorage
            const usuarioSalvo = JSON.parse(localStorage.getItem('usuarioRegistrado'));

            // Verifica se as credenciais conferem
            if (usuarioSalvo && usuarioSalvo.email === emailDigitado && usuarioSalvo.senha === senhaDigitada) {
                alert('Bem-vindo(a) à Inovateca, ' + usuarioSalvo.nome + '!');
                window.location.href = 'Catálogo.html';
            } else {
                alert('E-mail ou senha incorretos (ou conta ainda não cadastrada).');
            }
        });
    </script>
</body>
</html>
