<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>
<body>  
  <section id="tutoriais-secao" class="panel">

            <div class="contact-card">
                <div class="header-badge">
                    <i class="fas fa-play-circle"></i>

                </div>
                <h2>Aprenda a usar a <strong>Inovateca!</strong> 🎥</h2>
                <div class="security-list">
                    <div class="security-row tutorial-row">
                        <i class="fas fa-star" style="color: #ffd700;"></i>
                        <p>1. Como acessa a Biblioteca virtual</p>
                        <i class="fas fa-play-circle play-icon"></i>
                    </div>
                    <div class="security-row tutorial-row">

                    </div>

                        <i class="fas fa-star" style="color: #ffd700;"></i>
                        <p>4. Gerenciando Sua Biblioteca</p>
                        <i class="fas fa-play-circle play-icon"></i>
                    </div>
                </div>
                    <p class="footer-text" style="color:white">Tem alguma dúvida específica?</p>
                <div class="button-container">
                    <button class="btn-send" onclick="const s = document.getElementById('contato-secao'); s ? s.scrollIntoView({behavior:'smooth'}) : window.location.href='Contato.html'">
                        Fale Conosco
                    </button>
                </div>
            </div>
        </div>
        <img src="icones/logo2.png" alt="Inovateca" class="logo-fixa-canto" style="position: absolute; top: 20px; left: 20px; cursor: pointer;" onclick="window.location.href='Catálogo.html'">
    </section>
