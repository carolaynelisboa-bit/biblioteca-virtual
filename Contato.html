<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <section id="contato-secao" class="panel">
        <div class="container-contato">
            <div class="contact-card">
                <div class="header-badge">
                    <i class="fas fa-headset"></i>
                    <h1>Fale Conosco</h1>
                </div>
                <h2>Estamos aqui para <strong>ajudar você!</strong> 💜</h2>
                <form>
                    <div class="input-group">
                        <label>Seu Nome</label>
                        <input type="text" placeholder="Seu nome">
                    </div>
                    <div class="input-group">
                        <label>E-mail</label>
                        <input type="email" placeholder="seu.email@exemplo.com">
                    </div>
                    <div class="input-group">
                        <label>Mensagem</label>
                        <textarea rows="4" placeholder="Digite sua mensagem..."></textarea>
                    </div>
                    <div class="button-container">
                        <button type="submit" class="btn-send">Enviar</button>
                        <button type="button" class="btn-cancel">Cancelar</button>
                    </div>
                </form>
                <p class="footer-text">
                    Ou entre em contato direto: <a href="mailto:suport@exemplo.com">suport@exemplo.com</a>
                </p>
            </div>
        </div>
         <img src="icones/logo2.png" alt="Inovateca" class="logo-fixa-canto" style="position: absolute; top: 20px; left: 20px; cursor: pointer;" onclick="window.location.href='Catálogo.html'">
    </section>
<script src="script.js"></script>
</body>
</html>
