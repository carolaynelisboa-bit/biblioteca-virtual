<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Inovateca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="cadastro" class="panel">
        <div class="auth-card">
            <img src="icones/logo.png" alt="Inovateca" class="logo-gigante">
            <h2 style="margin-bottom:20px">Cadastro</h2>
            
            <div class="input-container">
                <input type="text" id="cad-nome" placeholder="Nome Completo">
                <input type="email" id="cad-email" placeholder="Seu melhor e-mail">
                <input type="text" id="cad-cpf" placeholder="CPF">
                <input type="tel" id="cad-telefone" placeholder="Telefone">
                <input type="password" id="cad-senha" placeholder="Crie uma senha">
                <input type="password" id="cad-confirma" placeholder="Confirme a senha">
            </div>
            
            <button class="btn-primary" id="btnFinalizarCadastro">Finalizar Cadastro</button>
            <p class="switch-auth"><a href="index.html">Voltar ao Login</a></p>
        </div>
    </section>

    <script src="script.js"></script>
    <script>
        document.getElementById('btnFinalizarCadastro').addEventListener('click', function() {
            const nome = document.getElementById('cad-nome').value.trim();
            const email = document.getElementById('cad-email').value.trim();
            const cpf = document.getElementById('cad-cpf').value.trim();
            const telefone = document.getElementById('cad-telefone').value.trim();
            const senha = document.getElementById('cad-senha').value;
            const confirmaSenha = document.getElementById('cad-confirma').value;

            // Validações básicas
            if (!nome || !email || !senha) {
                alert('Por favor, preencha todos os campos obrigatórios.');
                return;
            }

            if (senha !== confirmaSenha) {
                alert('As senhas não coincidem. Verifique e tente novamente.');
                return;
            }

            // Objeto com os dados do usuário
            const usuario = {
                nome: nome,
                email: email,
                cpf: cpf,
                telefone: telefone,
                senha: senha
            };

            // Salva os dados no localStorage
            localStorage.setItem('usuarioRegistrado', JSON.stringify(usuario));

            alert('Cadastro realizado com sucesso! Faça login para continuar.');
            
            // Redireciona para a tela de Login
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
