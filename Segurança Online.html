<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 <section id="seguranca-online" class="panel">
        <div class="container-contato">
            <div class="contact-card">
                <div class="header-badge">
                    <i class="fas fa-shield-alt"></i>
                    <h1>Segurança Online</h1>
                </div>
                <h2>Proteja seus <strong>dados!</strong> 🛡️</h2>
                <div class="security-list">
                    <div class="security-row">
                        <i class="fas fa-check-circle"></i>
                        <p>Use senhas fortes e únicas</p>
                    </div>
                    <div class="security-row">
                        <i class="fas fa-check-circle"></i>
                        <p>Ative a autenticação em duas etapas</p>
                    </div>
                    <div class="security-row">
                        <i class="fas fa-check-circle"></i>
                        <p>Tenha cuidado com e-mails suspeitos</p>
                    </div>
                    <div class="security-row">
                        <i class="fas fa-check-circle"></i>
                        <p>Mantenha seu dispositivo atualizado</p>
                    </div>
                </div>
                <p class="footer-text" style="color:white">Suspeita de alguma atividade incomum?</p>
                
                <div class="button-container">
                    <button class="btn-send" onclick="const s = document.getElementById('contato-secao'); s ? s.scrollIntoView({behavior:'smooth'}) : window.location.href='Contato.html'">
                        Fale Conosco
                    </button>
                </div>

            </div>
        </div>
<img src="icones/logo2.png" alt="Inovateca" class="logo-fixa-canto" style="position: absolute; top: 20px; left: 20px; cursor: pointer;" onclick="window.location.href='Catálogo.html'">
    </section>
    <script src="script.js"></script>
</body>
</html>
